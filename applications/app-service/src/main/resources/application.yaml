server:
  port: 8080

spring:
  application:
    name: "AuthMicroservice"

  devtools:
    add-properties: false

  sql:
    init:
      mode: always

  springdoc:
    api-docs:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true

cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

adapters:
  r2dbc:
    host: localhost
    port: 5432
    database: authdb
    schema: public
    username: postgres
    password: root

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    display-request-duration: true
    operations-sorter: alpha

logging:
  level:
    root: INFO
    co.com.auth: DEBUG
